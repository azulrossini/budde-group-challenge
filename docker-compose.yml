services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitbill}
      POSTGRES_DB: ${POSTGRES_DB:-splitbill}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitbill} -d ${POSTGRES_DB:-splitbill}"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-splitbill}:${POSTGRES_PASSWORD:-splitbill}@db:5432/${POSTGRES_DB:-splitbill}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
